name: Build open-shacc for PlayStation Vita

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-psvita:
    name: PlayStation Vita SUPRX Plugin (VitaSDK)
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display VitaSDK Environment
        run: |
          echo "VITASDK = $VITASDK"
          arm-vita-eabi-gcc -v
          arm-vita-eabi-g++ -v
          cmake --version
          which vita-elf-create vita-make-fself

      - name: Configure CMake for PS Vita
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_SHACC_BUILD_STATIC=ON \
            -DOPEN_SHACC_BUILD_SHARED=OFF \
            -DOPEN_SHACC_BUILD_CLI=OFF \
            -DOPEN_SHACC_BUILD_TESTS=OFF

      - name: Build PS Vita Targets
        run: cmake --build build --config Release --verbose

      - name: Generate SUPRX Plugin Modules
        run: |
          # Build target or run toolchain generator
          if [ -f build/open-shacc-elf ]; then
            echo "Packaging SUPRX from open-shacc-elf..."
            vita-elf-create build/open-shacc-elf build/open-shacc.velf -e module.yml
            vita-make-fself -s build/open-shacc.velf build/open-shacc.suprx
            cp build/open-shacc.suprx build/libshacccg.suprx
          fi
          ls -lh build/*.suprx build/*.a

      - name: Verify Export Symbols
        run: |
          arm-vita-eabi-nm -g --defined-only build/libopen-shacc.a | grep -E "(SceShaccCg|module_start|module_stop)"

      - name: Upload PS Vita SUPRX Plugin & Library
        uses: actions/upload-artifact@v4
        with:
          name: open-shacc-psvita-suprx-plugin
          path: |
            build/*.suprx
            build/libopen-shacc.a
            include/open_shacc.h
            module.yml
            README.md

  build-host:
    name: Host Linux (CLI & Test Suite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure Host CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_SHACC_BUILD_SHARED=ON \
            -DOPEN_SHACC_BUILD_STATIC=ON \
            -DOPEN_SHACC_BUILD_CLI=ON \
            -DOPEN_SHACC_BUILD_TESTS=ON

      - name: Build Host Tools & Tests
        run: cmake --build build --config Release

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Compile Sample Shaders with CLI
        run: |
          ./build/open-shacc-cli samples/basic_mvp.cg -o build/basic_mvp.gxp -v
          ./build/open-shacc-cli samples/textured_lighting.cg -o build/textured_lighting.gxp -v
          ls -lh build/*.gxp

      - name: Upload Host Tools & Shaders
        uses: actions/upload-artifact@v4
        with:
          name: open-shacc-host-tools
          path: |
            build/libopen-shacc*
            build/open-shacc-cli
            build/*.gxp
            include/open_shacc.h
